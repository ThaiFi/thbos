name: bench-e2e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, bare-metal-dual-schelk]
    timeout-minutes: 5
    steps:
      - name: Inspect benchmark metrics listener
        shell: bash
        run: |
          set -euo pipefail
          hostname
          uptime
          sudo ss -lntp '( sport = :9001 or sport = :9101 or sport = :8545 or sport = :8645 )'
          ps -C tempo -C reth -o pid,user,etimes,pcpu,pmem,comm || true
          sudo ss -lntp 'sport = :9001' | sed -n 's/.*pid=\([0-9]*\).*/\1/p' | while read -r listener_pid; do
            printf 'Listener executable: '
            sudo readlink "/proc/$listener_pid/exe" || true
            ps -p "$listener_pid" -o pid,ppid,user,etimes,pcpu,pmem,comm
            printf 'Listener cgroup: '
            sudo cat "/proc/$listener_pid/cgroup"
          done
