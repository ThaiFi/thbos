name: bench-e2e-multi-region

on:
  workflow_call:
    inputs:
      cloud:
        type: string
        required: false
        default: "gcp"
      baseline:
        type: string
        required: false
        default: ""
      feature:
        type: string
        required: false
        default: ""
      baseline-name:
        type: string
        required: false
        default: ""
      feature-name:
        type: string
        required: false
        default: ""
      preset:
        type: string
        required: false
        default: "default"
      duration:
        type: string
        required: false
        default: "90"
      bloat:
        type: string
        required: false
        default: "100"
      validator-count:
        type: string
        required: false
        default: "10"
      regions:
        type: string
        required: false
        default: ""
      tps:
        type: string
        required: false
        default: "50000"
      accounts:
        type: string
        required: false
        default: "1000"
      max-concurrent-requests:
        type: string
        required: false
        default: "5000"
      general-gas-limit:
        type: string
        required: false
        default: "1500000000"
      run-pairs:
        type: string
        required: false
        default: "1"
      clickhouse-run:
        type: string
        required: false
        default: "feature-1"
      txgen-ref:
        type: string
        required: false
        default: ""
      token-count:
        type: string
        required: false
        default: "4"
      otlp:
        type: boolean
        required: false
        default: true
      metrics:
        type: boolean
        required: false
        default: false
      tcp-highres:
        type: boolean
        required: false
        default: false
      valscope:
        type: boolean
        required: false
        default: true
    secrets:
      BENCH_LOGS_PUSH_URL:
        required: false
      TEMPO_TELEMETRY_URL:
        required: false
      BENCH_VICTORIAMETRICS_URL:
        required: false
      CLICKHOUSE_URL:
        required: false
      CLICKHOUSE_USER:
        required: false
      CLICKHOUSE_PASSWORD:
        required: false
      VICTORIALOGS_URL:
        required: false
      VICTORIAMETRICS_URL:
        required: false
      VALSCOPE_CONTROL_URL:
        required: false
      VALSCOPE_INTERNAL_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud provider used for disposable benchmark infrastructure.
        type: choice
        required: true
        default: gcp
        options:
          - aws
          - gcp
      baseline:
        description: Git ref for the baseline run. Empty = merge-base of the selected branch with main.
        type: string
        required: false
        default: ""
      feature:
        description: Git ref for the feature run. Empty = selected branch HEAD.
        type: string
        required: false
        default: ""
      baseline-hardfork:
        description: Latest active hardfork for the baseline run. Empty = latest Tempo hardfork.
        type: string
        required: false
        default: ""
      feature-hardfork:
        description: Latest active hardfork for the feature run. Empty = latest Tempo hardfork.
        type: string
        required: false
        default: ""
      preset:
        description: Benchmark preset.
        type: choice
        required: true
        default: default
        options:
          - default
          - tip20
          - tip20_2d_nonces
          - tip20_protocol_nonces
          - tip20_random_recipients
          - tip20_existing_recipients
          - tip20_keychain
          - tip20_keychain_random_recipients
          - tip20_keychain_existing_recipients
          - tip20_key_authorization
          - mpp
          - mix
          - public-mix
          - dex
      duration:
        description: Benchmark duration in seconds.
        type: string
        required: true
        default: "90"
      bloat:
        description: State bloat size in GB.
        type: choice
        required: true
        default: "100"
        options:
          - "0"
          - "1"
          - "10"
          - "100"
      validator-count:
        description: Number of validators.
        type: string
        required: true
        default: "10"
      regions:
        description: Comma-separated cloud regions. Empty uses the selected cloud's five defaults.
        type: string
        required: false
        default: ""
      tps:
        description: Target transactions per second.
        type: string
        required: true
        default: "50000"
      accounts:
        description: Number of benchmark accounts.
        type: string
        required: true
        default: "1000"
      max-concurrent-requests:
        description: Max concurrent sender requests.
        type: string
        required: true
        default: "5000"
      txgen-ref:
        description: Optional ref to pin in tempoxyz/txgen.
        type: string
        required: false
        default: ""
      profiling:
        description: Profiling.
        type: choice
        required: true
        default: "off"
        options:
          - "off"
          - samply
          - tracy
          - both
      otlp:
        description: Export OTLP traces and logs.
        type: boolean
        required: true
        default: true
      metrics:
        description: Upload benchmark metrics to VictoriaMetrics.
        type: boolean
        required: true
        default: false
      tcp-highres:
        description: Collect and process high-resolution validator TCP samples.
        type: boolean
        required: true
        default: false
      valscope:
        description: Register live ValScope targets for each benchmark phase.
        type: boolean
        required: true
        default: true
      baseline-args:
        description: Extra args passed only to the baseline node.
        type: string
        required: false
        default: ""
      feature-args:
        description: Extra args passed only to the feature node.
        type: string
        required: false
        default: ""
      gas-limit:
        description: Builder gas limit.
        type: string
        required: true
        default: "5000000000"
      no-cache:
        description: Skip binary cache.
        type: boolean
        required: true
        default: false
      bench-args:
        description: Extra bench args.
        type: string
        required: false
        default: ""
      run-pairs:
        description: Number of baseline/feature run pairs.
        type: string
        required: true
        default: "1"
permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

env:
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"

jobs:
read-benchmark-progress:
  permissions:
    contents: read
    id-token: write
  runs-on: depot-ubuntu-latest-8
  timeout-minutes: 10
  env:
    BENCH_GCP_PROJECT_ID: chain-benchmarking-zygis
    BENCH_GCP_WIF_PROVIDER: projects/383683155128/locations/global/workloadIdentityPools/tempo-benchmark/providers/tempo-benchmark
    BENCH_GCP_SERVICE_ACCOUNT: benchmark-runner@chain-benchmarking-zygis.iam.gserviceaccount.com
    BENCH_INPUT_CLOUD: gcp
  steps:
  - name: Secure runner
    uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584
  - name: Fetch GitHub token via STS
    id: github-sts
    uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584
    with:
      scope: tempoxyz/tempo-multi-region-benchmark
      policy: bench-e2e-multi-region
  - name: Check org membership
    if: github.event_name != 'schedule'
    uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
    with:
      github-token: ${{ steps.github-sts.outputs.token }}
      script: "const org = 'tempoxyz';\nconst username = context.actor;\n\ntry {\n  const { status } = await github.rest.orgs.checkMembershipForUser({\
        \ org, username });\n  if (status === 204 || status === 302) {\n    return;\n  }\n} catch {}\n\ncore.setFailed(`@${username}\
        \ is not a member of ${org}`);\n"
  - name: Isolate Google Cloud CLI state
    if: env.BENCH_INPUT_CLOUD == 'gcp'
    run: "gcloud_config_dir=\"$RUNNER_TEMP/gcloud-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\nmkdir -p \"$gcloud_config_dir\"\
      \n{\n  echo \"CLOUDSDK_CONFIG=$gcloud_config_dir\"\n  echo \"CLOUDSDK_CORE_PROJECT=$BENCH_GCP_PROJECT_ID\"\
      \n} >> \"$GITHUB_ENV\"\n"
  - name: Authenticate to Google Cloud
    if: env.BENCH_INPUT_CLOUD == 'gcp'
    uses: tempoxyz/gh-actions/vendor/google-github-actions/auth@35019557465e3c38ee3468be171771fd73577584
    with:
      workload_identity_provider: ${{ env.BENCH_GCP_WIF_PROVIDER }}
      service_account: ${{ env.BENCH_GCP_SERVICE_ACCOUNT }}
  - name: Setup Google Cloud CLI
    if: env.BENCH_INPUT_CLOUD == 'gcp'
    uses: tempoxyz/gh-actions/vendor/google-github-actions/setup-gcloud@35019557465e3c38ee3468be171771fd73577584
    with:
      project_id: ${{ env.BENCH_GCP_PROJECT_ID }}
  - name: Read active benchmark progress
    run: "set -euo pipefail\nmkdir -p progress\nprefix=gs://tempo-benchmark-artifacts-383683155128-us-east1/runs/bench-e2e-multi-region-39514560289-1/artifacts/runner\n\
      for name in status.json timings.json timings.ndjson report.json txgen-report.json; do\n  if gcloud storage\
      \ cp \"$prefix/$name\" \"progress/$name\"; then\n    if [[ \"$name\" != txgen-report.json ]]; then cat \"\
      progress/$name\"; fi\n  fi\ndone\ngcloud storage ls \"$prefix/**\" > progress/object-list.txt\ncat progress/object-list.txt\n"
  - name: Upload benchmark progress
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    with:
      name: multi-region-jit-live-progress
      path: progress
      if-no-files-found: error
